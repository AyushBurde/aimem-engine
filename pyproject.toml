[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aimem-engine"
version = "0.1.0"
description = "AI Agent Memory Service — context graphs, contradiction detection, and intelligent retrieval for AI apps."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Your Name", email = "you@example.com"},
]
keywords = ["ai", "memory", "context", "llm", "embeddings", "faiss"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "google-genai>=0.1",
    "sentence-transformers>=2.2",
    "numpy>=1.24",
    "faiss-cpu>=1.7",
    "bcrypt>=4.0",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
server = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "jinja2",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[project.urls]
Homepage = "https://github.com/yourusername/aimem"
Repository = "https://github.com/yourusername/aimem"

[tool.setuptools.packages.find]
include = ["aimem*"]
